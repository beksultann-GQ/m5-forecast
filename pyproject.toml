[project]
name = "m5-forecast"
version = "0.1.0"
description = "M5 Forecasting Accuracy: production-ready pipeline (DuckDB + LightGBM + Airflow + MLflow)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17.0",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "mlflow>=2.16",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.38", "plotly>=5.24"]
monitoring = ["evidently>=0.4.40"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "kaggle>=1.6",
]

[project.scripts]
m5 = "m5.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "C4", "PTH", "RUF"]
ignore = [
    "E501",
    # Документация и комментарии на русском — кириллица не «неоднозначные символы»
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"dags/*" = ["E402"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: тесты, требующие полного датасета",
    "network: тесты, ходящие во внешние API",
]

[tool.coverage.run]
source = ["src/m5"]
