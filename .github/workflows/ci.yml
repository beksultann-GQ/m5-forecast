name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Линт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check src tests dags
      - name: ruff format --check
        run: uv run ruff format --check src tests dags

  test:
    name: Тесты
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: pytest
        # Сетевые тесты не гоняем: CI не должен зависеть от Open-Meteo и Nager.Date
        run: uv run pytest -m "not network and not slow" --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  dag-validation:
    name: Валидация DAG'ов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Установить Airflow
        run: |
          uv venv
          uv pip install "apache-airflow==2.10.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.2/constraints-3.12.txt"
          uv pip install -e .
      - name: Проверить, что DAG'и импортируются
        run: |
          export AIRFLOW_HOME=$(mktemp -d)
          uv run python -c "
          from airflow.models import DagBag
          bag = DagBag(dag_folder='dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          print(f'DAGs OK: {sorted(bag.dag_ids)}')
          "

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Собрать образ приложения
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: false
          load: true
          tags: m5-forecast:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-тест образа
        run: docker run --rm m5-forecast:${{ github.sha }} --help

  config-check:
    name: Инварианты конфигов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Проверить инварианты (лаги >= горизонта и т.д.)
        run: uv run pytest tests/test_config.py -v
